joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear: 0.

    axis_angular:
      yaw: 2
    scale_angular: 1.  # Adjust this value to scale angular motion

    enable_button: 4
    require_enable_button: true